spring.application.name=backend
server.port=12345

# Local file uploads (avatar, product images fallback)
app.upload.dir=uploads

# Bank transfer / VietQR (override in application-secret.properties)
app.bank.bin=970436
app.bank.account-number=
app.bank.account-name=
app.bank.bank-name=Vietcombank
app.bank.qr-template=compact2
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Import secret properties
spring.config.import=optional:classpath:application-secret.properties

# Database Configuration (datasource URL in application-secret.properties)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.open-in-view=false

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.socket-timeout=60000

# Transaction Configuration
spring.jpa.properties.hibernate.current_session_context_class=org.springframework.orm.hibernate5.SpringSessionContext
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Oauth2 Google
spring.security.oauth2.client.registration.google.scope=openid, profile, email
spring.security.oauth2.client.provider.google.issuer-uri=https://accounts.google.com

# Oauth2 Facebook
spring.security.oauth2.client.registration.facebook.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile

spring.security.oauth2.client.provider.facebook.authorization-uri=https://www.facebook.com/v15.0/dialog/oauth
spring.security.oauth2.client.provider.facebook.token-uri=https://graph.facebook.com/v15.0/oauth/access_token
spring.security.oauth2.client.provider.facebook.user-name-attribute=id
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/me?fields=id,name,email,picture.type(large)

# Logging
logging.level.secure_shop.backend=debug
logging.level.org.springframework.security=debug
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=trace
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
logging.level.org.springframework.web.cors=DEBUG
logging.level.secure_shop.backend.security=DEBUG

# JWT
jwt.private-key-file=classpath:keys/private.pem
jwt.public-key-file=classpath:keys/public.pem
jwt.access-token-expire-seconds=900
jwt.refresh-token-expire-seconds=604800
jwt.issuer=secure-shop-backend

# Frontend
frontend.url=http://localhost:5173

# CORS
spring.web.cors.allowed-origins=http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# AI (Enabled - Github Models API)
spring.ai.openai.base-url=https://models.github.ai/inference
spring.ai.openai.model=gpt-4o-mini
spring.ai.openai.timeout=30s
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.embedding.model=text-embedding-3-small

# VectorStore (PGVector) configuration
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.table-name=ai_vector_store
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance=cosine
spring.ai.vectorstore.pgvector.dimensions=1536

# Mail server
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=60000

# Redis Connection Pool
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=-1

# REDIS CACHE
spring.cache.type=redis
spring.cache.redis.time-to-live=30m

# List cache names
spring.cache.cache-names=articles_active,article_by_slug,categories,brands,articles_v2,article_slug_v2

# Development - xem t?t c? logs (bao g?m DEBUG)
logging.level.secure_shop.backend.utils.VNPayLogger=DEBUG
